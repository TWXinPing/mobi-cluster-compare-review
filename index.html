<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOBI cluster · 處理流程比較（離線）</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #18181b;
    --muted: #52525b;
    --faint: #71717a;
    --border: #d4d4d8;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --info-bg: #eff6ff;
    --info-bd: #bfdbfe;
    --warn-bg: #fffbeb;
    --warn-bd: #fde68a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    line-height: 1.45;
  }
  .wrap {
    max-width: 1480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
  h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); font-size: 13px; }
  .faint { color: var(--faint); font-size: 12px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .stack-lg { gap: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid2 {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .grid2 { grid-template-columns: 1fr; }
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }
  .panel-meta {
    min-height: 152px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-notes {
    min-height: 56px;
    max-height: 56px;
    overflow: auto;
  }
  .divider {
    height: 1px;
    background: var(--border);
    border: 0;
    margin: 4px 0;
  }
  .callout {
    border: 1px solid var(--info-bd);
    background: var(--info-bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .callout.warn {
    border-color: var(--warn-bd);
    background: var(--warn-bg);
  }
  .pill {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  select {
    min-height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-h {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
  }
  .card-h .trail { color: var(--muted); font-weight: 500; }
  .card-b { padding: 12px; }
  .label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .fig {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 4px;
    background: #fafafa;
    flex: 1 1 auto;
    width: 100% !important;
    max-width: 100%;
    height: auto !important;
    min-width: 0;
  }
  .fig img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
  .anat-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    align-items: flex-start;
  }
  .anat-row .fig {
    width: 140px !important;
    height: 140px !important;
    max-width: calc(50% - 6px) !important;
    flex: 0 0 140px !important;
    aspect-ratio: 1 / 1;
  }
  .anat-row .fig img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .pair-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 8px;
    min-width: 0;
    align-items: flex-start;
  }
  .pair-row > div {
    flex: 1 1 0;
    min-width: 0;
  }
  .pair-row .fig {
    width: 100% !important;
    max-width: 100% !important;
    flex: 1 1 auto !important;
  }
</style>
</head>

const PIPE_ORDER = ["autoNum", "N31", "N31_optk", "N34", "OG"];

const state = {
  viewMode: "dual",
  leftPipe: "OG",
  rightPipe: "N31_optk",
  leftResult: "abs_legacy",
  rightResult: "abserror",
  singlePipe: "OG",
  singleResult: "abs_m200",
  focusCluster: "all",
};

function getPipe(id) {
  return DATA.pipelines[id];
}
function pipeOptions() {
  return PIPE_ORDER.filter((id) => getPipe(id)).map((id) => ({
    value: id,
    label: getPipe(id).label,
  }));
}
function resultOptions(pipeId) {
  const pipe = getPipe(pipeId);
  if (!pipe) return [];
  return Object.values(pipe.results).map((r) => ({ value: r.id, label: r.label }));
}
function defaultResult(pipeId) {
  const opts = resultOptions(pipeId);
  return opts[0] ? opts[0].value : "";
}
function ensureResult(pipeId, resultId) {
  const opts = resultOptions(pipeId);
  if (opts.some((o) => o.value === resultId)) return resultId;
  return opts[0] ? opts[0].value : "";
}
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function figHtml(src, alt, w, h) {
  if (!src) return "";
  // Width/height attrs are aspect hints only; CSS forces column-fit width.
  return (
    '<div class="fig" style="aspect-ratio:' +
    w +
    "/" +
    h +
    '">' +
    '<img src="' +
    src +
    '" alt="' +
    esc(alt) +
    '" title="Click to open full resolution" style="cursor:zoom-in" onclick="(function(el){var x=window.open(\'\');if(!x)return;x.document.write(\'<!doctype html><title>\'+el.alt+\'</title><img src=&quot;\'+el.src+\'&quot; style=&quot;max-width:100%;height:auto;display:block;margin:0 auto&quot;>\');x.document.close();})(this)" />' +
    "</div>"
  );
}
function clusterBlock(c, wide, figLabels) {
  const bits = [];
  if (c.mean_x != null) bits.push("x=" + Number(c.mean_x).toFixed(1));
  if (c.mean_y != null) bits.push("y=" + Number(c.mean_y).toFixed(1));
  if (c.mean_z != null) bits.push("z=" + Number(c.mean_z).toFixed(1));
  const yLabel = bits.length ? bits.join(" · ") : "no xyz";
  const figW = wide ? 720 : 480;
  const figH = wide ? 560 : 380;
  const anatW = wide ? 200 : 140;
  const anatH = wide ? 200 : 140;
  const labels = figLabels || [];
  const ovLabel =
    labels[0] ||
    "TFCE overview (MI vividness; intercept | slope by condition)";
  const ov2Label = labels[1] || "TFCE panel 2";
  let anat = "";
  if (c.topo || c.dip) {
    anat =
      '<div class="anat-row">' +
      figHtml(c.topo, "cluster " + c.n + " topo", anatW, anatH) +
      figHtml(c.dip, "cluster " + c.n + " dipoles", anatW, anatH) +
      "</div>";
  }
  let body = '<div class="stack">' + anat;
  if (c.intercept_pos || c.intercept_neg) {
    body +=
      '<div class="pair-row">' +
      '<div><div class="label">Intercept pos</div>' +
      figHtml(c.intercept_pos, "cluster " + c.n + " intercept pos", figW, figH) +
      "</div>" +
      '<div><div class="label">Intercept neg</div>' +
      figHtml(c.intercept_neg, "cluster " + c.n + " intercept neg", figW, figH) +
      "</div></div>";
  }
  if (c.slope_pos || c.slope_neg) {
    body +=
      '<div class="pair-row">' +
      '<div><div class="label">Slope pos</div>' +
      figHtml(c.slope_pos, "cluster " + c.n + " slope pos", figW, figH) +
      "</div>" +
      '<div><div class="label">Slope neg</div>' +
      figHtml(c.slope_neg, "cluster " + c.n + " slope neg", figW, figH) +
      "</div></div>";
  }
  if (c.intercept) {
    body +=
      '<div><div class="label">Intercept 3×3 (vs 0 on diagonal; pairwise off-diagonal)</div>' +
      figHtml(c.intercept, "cluster " + c.n + " intercept", figW, figH) +
      "</div>";
  }
  if (c.slope) {
    body +=
      '<div><div class="label">Slope 3×3 (condition × continuous predictor)</div>' +
      figHtml(c.slope, "cluster " + c.n + " slope", figW, figH) +
      "</div>";
  }
  if (c.overview && !c.intercept && !c.slope) {
    const ovW = wide ? 720 : 480;
    const ovH = wide ? 520 : 400;
    body +=
      '<div><div class="label">' +
      esc(ovLabel) +
      "</div>" +
      figHtml(c.overview, "cluster " + c.n + " TFCE overview", ovW, ovH) +
      "</div>";
  }
  if (c.overview2 && !c.intercept && !c.slope) {
    const ovW = wide ? 720 : 480;
    const ovH = wide ? 520 : 400;
    body +=
      '<div><div class="label">' +
      esc(ov2Label) +
      "</div>" +
      figHtml(c.overview2, "cluster " + c.n + " TFCE panel 2", ovW, ovH) +
      "</div>";
  }
  body += "</div>";
  return (
    '<div class="card"><div class="card-h"><span>Cluster ' +
    c.n +
    '</span><span class="trail">' +
    esc(yLabel) +
    "</span></div><div class=\"card-b\">" +
    body +
    "</div></div>"
  );
}
function selectHtml(id, value, options, minWidth) {
  let opts = options
    .map(function (o) {
      return (
        '<option value="' +
        esc(o.value) +
        '"' +
        (o.value === value ? " selected" : "") +
        ">" +
        esc(o.label) +
        "</option>"
      );
    })
    .join("");
  return (
    '<select id="' +
    id +
    '" style="min-width:' +
    minWidth +
    'px">' +
    opts +
    "</select>"
  );
}
function panelHtml(side, title, pipeId, resultId, wide) {
  const pipe = getPipe(pipeId);
  const rid = ensureResult(pipeId, resultId);
  const result = pipe && pipe.results[rid];
  const clusters = result ? result.clusters : [];
  const noteTitle = [
    pipe ? pipe.note : "",
    result
      ? result.blurb +
        " · " +
        clusters.length +
        " cluster" +
        (clusters.length === 1 ? "" : "s")
      : "",
  ]
    .filter(Boolean)
    .join("\n");
  let notes = '<div class="panel-notes muted" title="' + esc(noteTitle) + '">';
  if (pipe) {
    notes += "<div>" + esc(pipe.note) + "</div>";
  }
  if (result) {
    notes +=
      "<div>" +
      esc(result.blurb) +
      " · " +
      clusters.length +
      " cluster" +
      (clusters.length === 1 ? "" : "s") +
      "</div>";
  }
  notes += "</div>";
  let html =
    '<div class="panel" data-panel="' +
    side +
    '"><div class="panel-meta"><h2>' +
    esc(title) +
    '</h2><div class="row">' +
    selectHtml(side + "-pipe", pipeId, pipeOptions(), 180) +
    selectHtml(side + "-result", rid, resultOptions(pipeId), 260) +
    "</div>" +
    notes +
    "</div>";
  if (!result || !clusters.length) {
    html +=
      '<div class="callout warn">此流程目前沒有所選 result 的 unsigned LME 圖（之後跑完可重跑產生器補上）。</div>';
  } else {
    html +=
      '<div class="stack" style="gap:16px">' +
      clusters
        .map(function (c) {
          return clusterBlock(c, wide, result && result.fig_labels);
        })
        .join("") +
      "</div>";
  }
  html += "</div>";
  return html;
}
function bindSelect(id, onChange) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("change", function () {
    onChange(el.value);
  });
}
function render() {
  const lp = getPipe(state.leftPipe) ? state.leftPipe : (pipeOptions()[0] || { value: "OG" }).value;
  const rp = getPipe(state.rightPipe) ? state.rightPipe : (pipeOptions()[0] || { value: "N31_optk" }).value;
  const sp = getPipe(state.singlePipe) ? state.singlePipe : (pipeOptions()[0] || { value: "OG" }).value;
  const lr = ensureResult(lp, state.leftResult);
  const rr = ensureResult(rp, state.rightResult);
  const sr = ensureResult(sp, state.singleResult);
  state.leftPipe = lp;
  state.rightPipe = rp;
  state.singlePipe = sp;
  state.leftResult = lr;
  state.rightResult = rr;
  state.singleResult = sr;

  const singleClusters = (getPipe(sp) && getPipe(sp).results[sr] && getPipe(sp).results[sr].clusters) || [];
  const focusOpts = [{ value: "all", label: "All clusters (A→P, L→R)" }].concat(
    singleClusters.map(function (c) {
      const bits = [];
      if (c.mean_x != null) bits.push("x=" + Number(c.mean_x).toFixed(1));
      if (c.mean_y != null) bits.push("y=" + Number(c.mean_y).toFixed(1));
      if (c.mean_z != null) bits.push("z=" + Number(c.mean_z).toFixed(1));
      return {
        value: String(c.n),
        label: bits.length
          ? "Cluster " + c.n + " (" + bits.join(", ") + ")"
          : "Cluster " + c.n,
      };
    })
  );
  if (!focusOpts.some(function (o) { return o.value === state.focusCluster; })) {
    state.focusCluster = "all";
  }
  const shown =
    state.focusCluster === "all"
      ? singleClusters
      : singleClusters.filter(function (c) {
          return String(c.n) === state.focusCluster;
        });

  let main = "";
  if (state.viewMode === "dual") {
    main =
      '<div class="grid2">' +
      panelHtml("left", "Left", lp, lr, false) +
      panelHtml("right", "Right", rp, rr, false) +
      "</div>";
  } else {
    main =
      '<div class="stack">' +
      '<div class="row">' +
      selectHtml("single-pipe", sp, pipeOptions(), 180) +
      selectHtml("single-result", sr, resultOptions(sp), 260) +
      selectHtml("focus-cluster", state.focusCluster, focusOpts, 200) +
      "</div>";
    if (getPipe(sp)) {
      main += '<div class="muted">' + esc(getPipe(sp).note) + "</div>";
    }
    if (getPipe(sp) && getPipe(sp).results[sr] && getPipe(sp).results[sr].blurb) {
      main += '<div class="muted">' + esc(getPipe(sp).results[sr].blurb) + "</div>";
    }
    if (!shown.length) {
      main +=
        '<div class="callout warn">此流程目前沒有所選 result 的 unsigned LME 圖。</div>';
    } else {
      main +=
        '<div class="stack" style="gap:16px">' +
        shown
          .map(function (c) {
            var res = getPipe(sp) && getPipe(sp).results[sr];
            return clusterBlock(c, true, res && res.fig_labels);
          })
          .join("") +
        "</div>";
    }
    main += "</div>";
  }

  document.getElementById("app").innerHTML =
    '<div class="stack stack-lg">' +
    "<div><h1>MOBI cluster · 處理流程比較</h1>" +
    '<div class="muted">雙欄並排（可切單欄）。流程：autoNum / N31 / N31_optk / N34 / OG。' +
    "OG 內再選 AbsError baseline 或 ppem。Cluster 排序：frontal → occipital（y 大→小），再左 → 右（x 小→大）。" +
    "跨流程 cluster 編號不可同源對齊。本頁為完全離線單檔 HTML。</div></div>" +
    '<div class="callout">N31_optk（AbsError 與 ppem）皆使用 baseline_lim = [−Inf, −200]。' +
    "OG AbsError · baseline (−Inf, 0) = study 根目錄 legacy full-epoch。" +
    "OG AbsError · baseline [−Inf, −200) = abserror_eye_toEEG（檔名 EncodeFromM200P1000 指分析窗，不是 baseline 起點）。" +
    "OG / N31_optk 的 ppem = OmegaHDeltaM5000；OG ppem 與 N31_optk 同為 baseline [−Inf, −200)。" +
    "OG MI vividness = vividness_in_MI（MiVivid_EncodeFromM200P1000；僅 MI trials；step8 視覺 1×2 intercept|slope）。" +
    "OG MI vividness · Legacy0 = study 根目錄 MiVivid_Legacy0_NoROI（c4/c10/c12；signed pos|neg）。3×3 只有 MI 有估計，VP／ME 與兩兩比較標成 not estimated。" +
    "N31_optk 額外 checkpoints = frontal theta（c4）AbsError×target-deviate（cat/cont / MEvp / 3-way）。" +
    "OG 額外 checkpoints = c9 ME×deviate（cat/cont）與 AbsError×Encode×deviate 3-way（cat/cont）。</div>" +
    '<div class="row">' +
    '<button type="button" class="pill' +
    (state.viewMode === "dual" ? " active" : "") +
    '" id="mode-dual">雙欄並排</button>' +
    '<button type="button" class="pill' +
    (state.viewMode === "single" ? " active" : "") +
    '" id="mode-single">單欄深看</button>' +
    "</div>" +
    '<hr class="divider" />' +
    main +
    '<div class="faint">' +
    esc(DATA.generated_note || "") +
    " · offline HTML export</div>" +
    "</div>";

  document.getElementById("mode-dual").onclick = function () {
    state.viewMode = "dual";
    render();
  };
  document.getElementById("mode-single").onclick = function () {
    state.viewMode = "single";
    render();
  };

  if (state.viewMode === "dual") {
    bindSelect("left-pipe", function (v) {
      state.leftPipe = v;
      state.leftResult = defaultResult(v);
      render();
    });
    bindSelect("left-result", function (v) {
      state.leftResult = v;
      render();
    });
    bindSelect("right-pipe", function (v) {
      state.rightPipe = v;
      state.rightResult = defaultResult(v);
      render();
    });
    bindSelect("right-result", function (v) {
      state.rightResult = v;
      render();
    });
  } else {
    bindSelect("single-pipe", function (v) {
      state.singlePipe = v;
      state.singleResult = defaultResult(v);
      state.focusCluster = "all";
      render();
    });
    bindSelect("single-result", function (v) {
      state.singleResult = v;
      state.focusCluster = "all";
      render();
    });
    bindSelect("focus-cluster", function (v) {
      state.focusCluster = v;
      render();
    });
  }
}

render();
</script>
</body>
</html>
